name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp verify
      - run: ./mvnw -B -ntp -Pe2e -pl integration-tests test-compile
  stack:
    needs: java
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start stack
        run: |
          docker compose --profile discovery config --quiet
          docker compose up --build -d --wait --wait-timeout 180
      - name: Run Java integration scenarios
        run: ./mvnw -B -ntp -Pe2e -pl integration-tests verify
      - name: Collect logs
        if: always()
        run: docker compose --profile discovery logs --no-color > stack.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-logs
          path: stack.log
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose --profile discovery down --remove-orphans
