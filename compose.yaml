name: traefik-poc
services:
  traefik:
    image: traefik:v3.6.2
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-poc-edge
      - --entrypoints.web.address=:80
      - --entrypoints.admin.address=:8080
      - --api.dashboard=true
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      traefik.http.routers.dashboard.entrypoints: admin
      traefik.http.routers.dashboard.service: api@internal
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    environment:
      SERVER_PORT: 8080
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.products.rule: "Path(`/api/products`) || PathPrefix(`/api/products/`)"
      traefik.http.routers.products.entrypoints: web
      traefik.http.routers.products.middlewares: api-common@file
      traefik.http.services.products.loadbalancer.server.port: "8080"
      traefik.http.services.products.loadbalancer.healthcheck.path: /actuator/health
      traefik.http.services.products.loadbalancer.healthcheck.interval: 3s
      traefik.http.services.products.loadbalancer.healthcheck.timeout: 1s
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      CATALOG_URL: http://product-service:8080
    depends_on:
      product-service:
        condition: service_healthy
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.orders.rule: "Path(`/api/orders`) || PathPrefix(`/api/orders/`)"
      traefik.http.routers.orders.entrypoints: web
      traefik.http.routers.orders.middlewares: api-common@file
      traefik.http.services.orders.loadbalancer.server.port: "8080"
      traefik.http.services.orders.loadbalancer.healthcheck.path: /actuator/health
      traefik.http.services.orders.loadbalancer.healthcheck.interval: 3s
      traefik.http.services.orders.loadbalancer.healthcheck.timeout: 1s
networks:
  edge:
    name: traefik-poc-edge
