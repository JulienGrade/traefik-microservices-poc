name: traefik-poc
services:
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    environment:
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8081:8080"
    networks: [edge]
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      CATALOG_URL: http://product-service:8080
    ports:
      - "127.0.0.1:8082:8080"
    networks: [edge]
networks:
  edge:
    name: traefik-poc-edge
