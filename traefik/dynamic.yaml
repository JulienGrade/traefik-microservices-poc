http:
  middlewares:
    api-common:
      chain:
        middlewares:
          - strip-api
          - response-headers
          - compression
    strip-api:
      stripPrefix:
        prefixes: [/api]
    response-headers:
      headers:
        contentTypeNosniff: true
        customResponseHeaders:
          X-Gateway: traefik
    compression:
      compress: {}
    product-rate:
      rateLimit:
        average: 20
        burst: 40
        period: 1s
